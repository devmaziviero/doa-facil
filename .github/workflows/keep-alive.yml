name: Keep alive

# Bate na API (Render) e numa rota que consulta o banco (Supabase)
# para o free tier nao "dormir" nem pausar por inatividade.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      API_URL: https://doa-facil-0z5o.onrender.com
    steps:
      - name: Acorda a API (health)
        run: curl -fsS --retry 5 --retry-delay 15 --retry-all-errors --max-time 90 "$API_URL/api/health"

      - name: Consulta o banco (lista doacoes)
        run: curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 60 "$API_URL/api/doacoes" -o /dev/null -w "status=%{http_code}\n"
